<style>

        </div>
<div class="flex gap-gutter">
<button class="text-primary hover:bg-primary/10 transition-colors active:scale-95 duration-100 p-2 rounded">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">settings</span>

<button class="text-outline hover:bg-primary/10 transition-colors active:scale-95 duration-100 p-2 rounded">
<span class="material-symbols-outlined">help</span>
</button>
</div>
</header>

<span class="font-label-caps text-label-caps">DASHBOARD</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 px-hud-padding py-3 text-primary border-r-2 border-primary bg-primary/5 transition-all duration-200 glow-text" href="#">

<button class="flex-1 py-1 font-label-caps text-label-caps text-background bg-primary neon-border shadow-none">MED</button>
<button class="flex-1 py-1 font-label-caps text-label-caps text-on-surface hover:text-error hover:bg-surface-bright transition-colors">HARD</button>
